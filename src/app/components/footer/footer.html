<footer class="page-footer" id="footer">
  <div class="container">
    <div class="row">
      <div class="col s12 m6 center-align">
        <h5 class="white-text">{{ nombreEmpresa }}</h5>
        <p class="grey-text text-lighten-4">
          Diseños modernos para tu hogar y estilo de vida.
        </p>
      </div>

      <div class="col s12 m6 center-align">
        <h6 class="white-text">Síguenos</h6>
        <ul class="social-list">
          <li *ngFor="let red of redesSociales">
            <a
              class="social-link"
              [href]="red.enlace"
              [target]="'_blank'"
              [attr.aria-label]="red.nombre"
              rel="noopener noreferrer"
            >
              <i [class]="'fab ' + red.icono"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="footer-copyright">
    <div class="container center-align">
      © {{ anioActual }} {{ nombreEmpresa }}. Todos los derechos reservados.
    </div>
  </div>
</footer>
